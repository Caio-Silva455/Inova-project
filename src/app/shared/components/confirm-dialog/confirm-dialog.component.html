@if (visivel) {
  <div class="overlay">
    <div class="dialog">
      <h3>{{ titulo }}</h3>
      <p>{{ mensagem }}</p>
      <div class="acoes">
        <button type="button" class="btn-secundario" (click)="cancelar.emit()">Cancelar</button>
        <button type="button" class="btn-perigo" (click)="confirmar.emit()">Confirmar</button>
      </div>
    </div>
  </div>
}
